<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Symbol-Logistik · UX-Vorschau</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <aside class="catalogue">
    <header class="identity">
      <a href="#start"><span class="identity-mark" aria-hidden="true">◆</span> Symbol-Logistik</a>
      <p>UX-Vorschau</p>
    </header>
    <nav id="catalogue" aria-label="Alle Spielansichten"></nav>
  </aside>
  <main class="workspace">
    <header class="workspace-header">
      <div>
        <p id="section" class="eyebrow"></p>
        <p id="screen-name" class="workspace-title"></p>
      </div>
      <nav class="stepper" aria-label="Durch die Ansichten blättern">
        <a id="previous" aria-label="Vorherige Ansicht">←</a>
        <span id="position"></span>
        <a id="next" aria-label="Nächste Ansicht">→</a>
      </nav>
    </header>
    <div id="screen"></div>
  </main>
</body>
</html>
